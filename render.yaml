services:
  - type: web
    name: soft-skills-journal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd app/flask_journal && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.11"
